<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <style>
      :root, html, body {
        background: transparent !important;
        background-color: transparent !important;
      }
    </style>
    <link rel="stylesheet" href="/src/desktop-lyrics.css" />
  </head>
  <body oncontextmenu="event.preventDefault()">
    <main id="desktop-lyrics" data-theme="aurora" data-align="center" data-tauri-drag-region>
      <div id="desktop-lyrics-toolbar" class="desktop-lyrics-toolbar">
        <div class="toolbar-drag-handle" data-tauri-drag-region title="按住拖动窗口">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M9 4a2 2 0 110-4 2 2 0 010 4zm0 8a2 2 0 110-4 2 2 0 010 4zm0 8a2 2 0 110-4 2 2 0 010 4zm6-16a2 2 0 110-4 2 2 0 010 4zm0 8a2 2 0 110-4 2 2 0 010 4zm0 8a2 2 0 110-4 2 2 0 010 4z"/></svg>
        </div>
        <div class="toolbar-actions">
          <button id="btn-prev" class="tb-btn" title="上一首">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="btn-play" class="tb-btn" title="播放/暂停">
            <svg id="icon-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="btn-next" class="tb-btn" title="下一首">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <span class="tb-divider"></span>
          <button id="btn-theme" class="tb-btn" title="切换主题 Preset">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61.43.53 1.03.89 1.7.89h1.83c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-4.97-4.03-9-9-9zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9s1.5.67 1.5 1.5S7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
          </button>
          <button id="btn-size-down" class="tb-btn" title="减小字号">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13H5v-2h14v2z"/></svg>
          </button>
          <button id="btn-size-up" class="tb-btn" title="增大字号">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <span class="tb-divider"></span>
          <button id="btn-line-mode" class="tb-btn" title="切换单行/双行模式">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
          </button>
          <button id="btn-lock" class="tb-btn" title="锁定歌词 (鼠标穿透)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </button>
          <button id="btn-close" class="tb-btn btn-close" title="关闭桌面歌词">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
      </div>
      <div id="desktop-lyrics-content">
        <div id="desktop-lyrics-main-container" class="desktop-lyrics-line-group main-group">
          <div id="desktop-lyrics-main">KimoPlayer</div>
          <div id="desktop-lyrics-translation"></div>
        </div>
        <div id="desktop-lyrics-countdown" class="desktop-lyrics-countdown" aria-hidden="true">
          <span class="cd-dot"></span>
          <span class="cd-dot"></span>
          <span class="cd-dot"></span>
        </div>
        <div id="desktop-lyrics-next-container" class="desktop-lyrics-line-group next-group">
          <div id="desktop-lyrics-next"></div>
          <div id="desktop-lyrics-next-translation"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/desktop-lyrics-window.js"></script>
  </body>
</html>
