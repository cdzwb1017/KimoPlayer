            style="width: 18px; height: 18px; cursor: pointer"
          />
        </div>
        <div
          class="setting-item"
          style="
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

          <label

        <div class="setting-item" style="margin-bottom: 24px">
