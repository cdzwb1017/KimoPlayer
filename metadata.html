<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <title>编辑歌曲信息与歌词</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="standalone-editor theme-dark" oncontextmenu="event.preventDefault()">
    <div id="metadata-editor-modal" class="modal-overlay">
      <div class="modal-content glassmorphism wide-modal metadata-editor-shell">
        <header class="modal-header metadata-editor-header">
          <div class="metadata-window-drag-region" data-tauri-drag-region aria-hidden="true"></div>
          <div class="modal-header-title-group">
            <h3>歌曲信息与歌词</h3>
            <span id="edit-metadata-filename-tip" class="filename-tip"></span>
          </div>
          <button id="metadata-editor-close" class="modal-close-btn" title="关闭" aria-label="关闭">&times;</button>
        </header>

        <div class="modal-workspace metadata-editor-workspace">
          <aside class="modal-workspace-left scrollable-column metadata-sidebar">
            <input type="hidden" id="edit-metadata-path" />
            <input type="hidden" id="edit-metadata-cover-path" />
            <input type="hidden" id="edit-metadata-remove-cover" value="false" />

            <section class="metadata-section cover-edit-section">
              <img id="edit-metadata-cover-preview" class="cover-preview-img" src="" alt="封面预览" />
              <div class="cover-edit-buttons">
                <button id="edit-metadata-change-cover" class="btn-secondary">更换封面</button>
                <button id="edit-metadata-delete-cover" class="btn-secondary btn-danger">移除</button>
              </div>
            </section>

            <section class="metadata-section">
              <div class="metadata-section-heading">
                <span>基本信息</span>
                <small>写入音频文件标签</small>
              </div>
              <div class="metadata-form-list">
                <div class="form-group">
                  <label for="edit-metadata-title">歌曲标题</label>
                  <input type="text" id="edit-metadata-title" class="form-input" placeholder="歌曲标题" />
                </div>
                <div class="form-group">
                  <label for="edit-metadata-artist">歌手</label>
                  <input type="text" id="edit-metadata-artist" class="form-input" placeholder="歌手名称" />
                </div>
                <div class="form-group">
                  <label for="edit-metadata-album">专辑</label>
                  <input type="text" id="edit-metadata-album" class="form-input" placeholder="专辑名称" />
                </div>
                <div class="form-row-2">
                  <div class="form-group">
                    <label for="edit-metadata-year">年份</label>
                    <input type="number" id="edit-metadata-year" class="form-input" placeholder="年份" />
                  </div>
                  <div class="form-group">
                    <label for="edit-metadata-genre">流派</label>
                    <input type="text" id="edit-metadata-genre" class="form-input" placeholder="流派" />
                  </div>
                </div>
                <div class="form-row-2">
                  <div class="form-group">
                    <label for="edit-metadata-track">音轨号</label>
                    <input type="number" id="edit-metadata-track" class="form-input" placeholder="音轨" />
                  </div>
                  <div class="form-group">
                    <label for="edit-metadata-disc">碟号</label>
                    <input type="number" id="edit-metadata-disc" class="form-input" placeholder="碟号" />
                  </div>
                </div>
              </div>
            </section>

            <details class="metadata-more-fields">
              <summary>更多创作信息</summary>
              <div class="metadata-form-list">
                <div class="form-group">
                  <label for="edit-metadata-album-artist">专辑艺术家</label>
                  <input type="text" id="edit-metadata-album-artist" class="form-input" placeholder="专辑艺术家" />
                </div>
                <div class="form-group">
                  <label for="edit-metadata-composer">作曲</label>
                  <input type="text" id="edit-metadata-composer" class="form-input" placeholder="作曲者" />
                </div>
                <div class="form-group">
                  <label for="edit-metadata-lyricist">作词</label>
                  <input type="text" id="edit-metadata-lyricist" class="form-input" placeholder="作词者" />
                </div>
                <div class="form-group">
                  <label for="edit-metadata-comment">备注</label>
                  <input type="text" id="edit-metadata-comment" class="form-input" placeholder="备注信息" />
                </div>
              </div>
            </details>
          </aside>

          <main class="modal-workspace-right metadata-lyrics-workspace">
            <div class="lyrics-workspace-heading">
              <div>
                <div class="metadata-editor-eyebrow">高保真歌词</div>
                <h4>歌词结构</h4>
              </div>
              <div class="lyrics-heading-actions">
                <button id="btn-lyrics-import" class="btn-secondary">导入歌词</button>
                <button id="btn-lyrics-raw-toggle" class="btn-secondary">查看原始文本</button>
                <button id="btn-lyrics-add-line" class="btn-secondary" style="display: none;">添加歌词行</button>
              </div>
              <div class="lyrics-document-status">
                <span id="lyrics-format-badge" class="lyrics-status-badge">读取中</span>
                <span id="lyrics-row-count" class="lyrics-row-count">0 行</span>
              </div>
            </div>

            <div id="lyrics-editor-viewport" class="lyrics-editor-viewport">
              <div class="lyrics-editor-loading">正在解析歌词结构…</div>
            </div>

            <div id="lyrics-editor-raw-container" class="lyrics-editor-raw-container" style="display: none;">
              <div class="lyrics-raw-notice">这里显示并编辑实际写入音频标签的完整歌词源码。</div>
              <textarea id="edit-metadata-lyrics" class="lyrics-raw-textarea" spellcheck="false" placeholder="在此粘贴 LRC、TTML 或 JSON 歌词…"></textarea>
            </div>
          </main>
        </div>

        <footer class="modal-footer metadata-editor-footer">
          <span class="metadata-save-hint">保存后播放器会重新载入歌曲信息与歌词</span>
          <div class="metadata-footer-actions">
            <button id="metadata-editor-cancel" class="btn-secondary">取消</button>
            <button id="metadata-editor-save" class="btn-primary">保存修改</button>
          </div>
        </footer>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
