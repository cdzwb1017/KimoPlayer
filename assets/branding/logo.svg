<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 蓝紫色渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <!-- 青色渐变 -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGradient)" stroke="none"/>
  
  <!-- 声波线条 -->
  <g filter="url(#glow)">
    <!-- 第1条声波 -->
    <path d="M 312 512 Q 412 412 512 512 Q 612 612 712 512" 
          stroke="url(#cyanGradient)" stroke-width="8" fill="none" opacity="0.9"/>
    
    <!-- 第2条声波 -->
    <path d="M 262 512 Q 362 362 512 512 Q 662 662 762 512" 
          stroke="url(#cyanGradient)" stroke-width="6" fill="none" opacity="0.7"/>
    
    <!-- 第3条声波 -->
    <path d="M 212 512 Q 312 312 512 512 Q 712 712 812 512" 
          stroke="url(#cyanGradient)" stroke-width="4" fill="none" opacity="0.5"/>
    
    <!-- 第4条声波 -->
    <path d="M 162 512 Q 262 262 512 512 Q 762 762 862 512" 
          stroke="url(#cyanGradient)" stroke-width="3" fill="none" opacity="0.3"/>
  </g>
  
  <!-- 中心播放按钮 -->
  <polygon points="462,412 462,612 582,512" fill="white" opacity="0.95"/>
  
  <!-- 文字 -->
  <text x="512" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">Kiom</text>
  <text x="512" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#00d2ff">Player</text>
</svg>
